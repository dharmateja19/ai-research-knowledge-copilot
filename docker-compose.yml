services:
  postgres:
    image: postgres:16
    container_name: research-copilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: research_copilot

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: research-copilot-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: research-copilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
  redis_data: